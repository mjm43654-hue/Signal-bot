name: 4H Market Scanner

on:
  schedule:
    # اسکن خودکار بازار هر ۱۵ دقیقه یک‌بار در ۲۴ ساعت شبانه‌روز
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Gann & Ichimoku Scan
        run: python -c "import trading_signal_bot; trading_signal_bot.run_scan()"
