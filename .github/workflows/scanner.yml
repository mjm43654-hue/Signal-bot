name: 4H Live Market Scanner

on:
  schedule:
    # هر ۳۰ دقیقه یک سرور زنده روشن می‌شود
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Live Scanner Loop
        run: |
          python -c "
          import trading_signal_bot as bot
          import time

          print('🚀 شروع مانیتورینگ زنده بازار (بررسی مداوم هر ۶۰ ثانیه)...')
          start = time.time()
          while time.time() - start < 1800:
              try:
                  bot.run_scan()
              except Exception as e:
                  print('Error:', e)
              time.sleep(60)
          "
